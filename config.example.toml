# Local override example.
#
# Shipped defaults live under defaults/*.toml. Copy only the settings you want
# to override into ignored repo-root config.toml.

[paths]
# Leave unset to use platform auto-detection.
# journal_dir = "/path/to/Saved Games/Frontier Developments/Elite Dangerous"
# bindings_file = "/path/to/Custom.binds"

[runtime]
# Omit platform to default to the host OS.
# platform = "macos"
# debug = true

[control_room]
# home_system = "Sol"
# command_delay_seconds = 5.0

[eddn]
# Live market prices for the /routes trade route search; the `lan` server listens when enabled.
# enabled = true
# database_file = ".eddn_markets.sqlite3"
# max_age_days = 7.0
# status_every_s = 30.0

[hub]
# "standalone" (default), "hub" or "peer" (docs/user/hub.md). Standalone and hub keep the
# market DB; a peer keeps none and sends searches and markets to the hub at `url`.
# role = "peer"
# url = "http://192.168.1.20:8765"
# token = "the hub's --token"

[controls]
# start_hotkey = "home"
# stop_hotkey = "end"

[controls.market]
# nav_delay_seconds = 0.1
# buy_max_hold_seconds = 20.0
# buy_top_up_max_attempts = 3 # 0 disables automatic haul top-ups

[timing]
# enabled = true

[tts]
# title_mode = "custom"
# title = "captain"
# disabled_messages = []

# Speak through a local Piper voice instead of the platform default (`say`,
# `spd-say`/`espeak-ng`, or Windows speech). `uv run python3 tools/setup_piper.py`
# installs piper-tts and a voice and writes this section for you.
# [tts.piper]
# executable = '~/.local/bin/piper'
# model = '~/.local/share/EDControlRoom/piper/voices/cori/en_GB-cori-high.onnx'
# Optional tuning; leave a key out to use the voice's own default. The
# /controls Voice panel and `voice set` / `voice save` change these live.
# length_scale = 1.0      # speaking pace, lower is faster
# noise_scale = 0.667     # intonation variation
# noise_w_scale = 0.8     # rhythm variation
# sentence_silence = 0.0  # seconds of silence after each sentence
# volume = 1.0            # loudness multiplier

[tts.phrases]
# destination_set = "Setting destination to {system_name}."

[messages.templates]
# dest_usage = "Usage: dest <system name>"

[error_messages.templates.station_mismatch]
# message = "Station mismatch: market data indicates {market_station}, but we are docked at {docked_station}."
# suggestion = "Open replay history with Ctrl-R, press e to edit the station name, then rerun."
