name: Discord Workflow Failure Notify

on:
  workflow_run:
    workflows:
      # Keep this list in sync with the repo workflows that should trigger Discord alerts.
      - Tests
    types:
      - completed

jobs:
  notify:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.name != 'Discord Workflow Failure Notify'
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post failure notification to Discord
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: |
          python3 tools/discord_workflow_failure_notify.py \
            --github-token "$GITHUB_TOKEN" \
            --discord-webhook-url "$DISCORD_WEBHOOK_URL" \
            --run-id "$RUN_ID" \
            --workflow-name "$WORKFLOW_NAME" \
            --workflow-url "$WORKFLOW_URL" \
            --branch-name "$BRANCH_NAME" \
            --commit-sha "$COMMIT_SHA" \
            --repository "$REPOSITORY" \
            --actor "$ACTOR"
