[project]
name = "EDControlRoom"
version = "1.37.0"
description = "Elite Dangerous control-room and routine tooling"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "playwright>=1.53",
  "PyYAML>=6.0",
  "pyobjc-framework-Quartz>=12.1; sys_platform == 'darwin'",
  "rich>=14.0",
  "starlette>=0.46",
  "textual>=0.60.0",
  "uvicorn>=0.34",
  "websockets>=15.0",
  "pyzmq>=26",
  "zeroconf>=0.154.0",
]

[tool.uv]
package = false
