[hub]
# "standalone" (one machine, the default), "hub" (the home Control Room that owns the market
# and station database) or "peer" (owns no data; asks the hub).
role = "standalone"
# Peer only: base URL of the hub, such as "http://192.168.1.20:8765".
url = ""
# The hub's access token (its `--token`).
token = ""
# Seconds to wait for the hub on route lookups and market pushes.
timeout_s = 10.0
# Seconds to wait for an Inara haul search, which drives a browser on the hub.
search_timeout_s = 180.0
# Seconds between hub reachability checks (logged on change, shown in the sidebar Hub chip).
heartbeat_s = 30.0
