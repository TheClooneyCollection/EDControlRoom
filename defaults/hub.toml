[hub]
# "standalone" (one machine, the default), "hub" (the home Control Room that owns the market
# and station database) or "peer" (owns no data; keeps a link open to the hub).
role = "standalone"
# Peer only, optional: base URL of the hub, such as "http://192.168.1.20:8765". Empty finds the hub
# on the LAN over mDNS and remembers the first one in `.control_room_known_hub.json` next to the
# config; delete that file to switch hubs.
url = ""
# Hub: the token peers must present on the link. Peer: the hub's token. Required for both.
token = ""
# This node's name on the hub; empty means the host name.
name = ""
# Peer only: markets, station facts and finished haul runs wait here until the hub acknowledges them.
outbox_file = ".control_room_hub_outbox.sqlite3"
# Hub only: every peer's finished haul runs (JSONL, tagged with their node). The hub's own runs
# stay in `control_room.haul_runs_file`.
runs_file = ".control_room_hub_runs.jsonl"
# Hub only: which node the hub voices and whether its speakers are on, as set from the hub pages.
voice_file = ".control_room_hub_voice.json"
# Seconds to wait for the hub on route, status and station fact requests.
timeout_s = 10.0
# Seconds to wait for an Inara haul search, which drives a browser on the hub.
search_timeout_s = 180.0
# Seconds of quiet on the link before the peer pings the hub; twice that without an answer redials.
heartbeat_s = 30.0
