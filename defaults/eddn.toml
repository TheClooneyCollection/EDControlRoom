[eddn]
# Listen to the EDDN relay for live market prices (used by the /routes trade route search).
enabled = false
relay = "tcp://eddn.edcd.io:9500"
database_file = ".eddn_markets.sqlite3"
# Markets not updated for this many days are dropped.
max_age_days = 7.0
# Seconds between EDDN status lines in the server log; 0 turns them off.
status_every_s = 30.0

[eddn.time_model]
# Seconds per leg for the /routes and Best deal trip time, fitted on 2026-11 journals:
# docked + travel base + first jump + per extra jump + coeff * Ls^(1/3) (+ surface extra).
# Override any of them in config.toml under [eddn.time_model].
docked_s = 90.0
travel_base_s = 110.0
first_jump_s = 170.0
per_extra_jump_s = 65.0
supercruise_coeff = 13.0
# Supercruise distance assumed when a station's Ls is unknown.
unknown_dist_ls = 1000.0
# Extra approach and landing time at a surface station.
surface_extra_s = 30.0
